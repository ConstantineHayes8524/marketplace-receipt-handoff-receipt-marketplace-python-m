[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplace-receipt-handoff"
version = "0.1.0"
description = "A typed FastAPI service that sends marketplace receipts when paid orders enter seller handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic[email]>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
receipt-service = "marketplace_receipts.receipt_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_receipts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
